<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AgroValle Conecta — Tu perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep: #1E3A2B;
    --green-deep-2: #16301F;
    --green-sage: #6C8F53;
    --green-sage-light: #9BB984;
    --white: #FFFFFF;
    --paper: #F5F7F1;
    --ink: #1B2119;
    --ink-soft: #4B564A;
    --line: rgba(30,58,43,0.14);
    --shadow: 0 12px 32px rgba(20,40,28,0.10);
    --radius: 4px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    margin:0;
    color:var(--green-deep-2);
    letter-spacing:-0.02em;
  }
  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--green-sage);
    font-weight:500;
  }
  p{color:var(--ink-soft);}
  a{color:inherit;}

  /* ===== HEADER (perfil / buscador / iconos) ===== */
  header.panel-nav{
    position:sticky; top:0; z-index:50;
    background:var(--white);
    border-bottom:1px solid var(--line);
  }
  .panel-nav-inner{
    display:flex; align-items:center; gap:24px;
    padding:14px 24px;
    max-width:1280px; margin:0 auto;
  }
  .perfil-btn{
    display:flex; align-items:center; gap:10px;
    background:none; border:none; cursor:pointer;
    font-family:'Work Sans',sans-serif; text-align:left; padding:0;
    flex-shrink:0;
  }
  .perfil-avatar{
    width:38px; height:38px; border-radius:50%;
    background:var(--green-deep); color:var(--white);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;
    flex-shrink:0;
  }
  .perfil-info{display:flex; flex-direction:column; line-height:1.2;}
  .perfil-info .eyebrow{font-size:10px;}
  .perfil-info span.nombre{font-size:14px; font-weight:600; color:var(--green-deep-2); max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .buscador{
    flex:1; display:flex; align-items:center; gap:10px;
    background:var(--paper); border:1px solid var(--line); border-radius:20px;
    padding:9px 16px; max-width:480px;
  }
  .buscador input{
    border:none; background:none; outline:none; flex:1;
    font-family:'Work Sans',sans-serif; font-size:14px; color:var(--ink);
  }
  .buscador svg{flex-shrink:0; opacity:0.55;}

  .nav-icons{display:flex; align-items:center; gap:6px; margin-left:auto; flex-shrink:0;}
  .icon-btn{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; cursor:pointer; color:var(--ink-soft);
    padding:6px 10px; border-radius:var(--radius); position:relative;
  }
  .icon-btn:hover{background:var(--paper);}
  .icon-btn span{font-family:'Space Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.04em;}
  .icon-badge{
    position:absolute; top:2px; right:6px; width:8px; height:8px; border-radius:50%;
    background:#B3413E; border:1.5px solid var(--white); display:none;
  }
  .icon-badge.show{display:block;}

  @media(max-width:760px){
    .perfil-info{display:none;}
    .icon-btn span{display:none;}
    .buscador{max-width:none;}
  }

  /* ===== PESTAÑAS ===== */
  .tabs-bar{
    display:flex; border-bottom:1px solid var(--line); background:var(--white);
    max-width:1280px; margin:0 auto; padding:0 24px;
  }
  .tab-item{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14.5px;
    color:var(--ink-soft); background:none; border:none; cursor:pointer;
    padding:16px 22px; border-bottom:2.5px solid transparent; letter-spacing:0.01em;
  }
  .tab-item.active{color:var(--green-deep-2); border-bottom-color:var(--green-deep);}
  .tab-item:hover:not(.active){color:var(--green-deep-2);}

  /* ===== CUERPO: feed + sidebar publicitaria ===== */
  .panel-body{
    max-width:1280px; margin:0 auto; padding:28px 24px 60px;
    display:grid; grid-template-columns:1fr 300px; gap:28px; align-items:start;
  }
  @media(max-width:900px){
    .panel-body{grid-template-columns:1fr; padding:20px 16px 48px;}
  }

  .feed{
    background:var(--white); border:1px solid var(--line); border-radius:var(--radius);
    min-height:520px; padding:20px;
  }
  .feed-empty{
    min-height:460px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; text-align:center; color:var(--ink-soft);
  }
  .feed-empty svg{opacity:0.4;}
  .feed-empty h3{font-size:16px; color:var(--ink-soft); font-weight:600;}
  .feed-empty p{font-size:13.5px; max-width:280px;}
  .feed-loading{padding:60px 0; text-align:center; color:var(--ink-soft); font-size:14px;}

  .publicacion-card{
    display:flex; gap:14px; padding:16px 4px; border-bottom:1px solid var(--line);
  }
  .publicacion-card:last-child{border-bottom:none;}
  .publicacion-img{
    width:88px; height:88px; border-radius:var(--radius); background:var(--paper);
    flex-shrink:0; object-fit:cover; border:1px solid var(--line);
  }
  .publicacion-info h4{font-size:15px;}
  .publicacion-info p{font-size:13px; margin-top:4px;}
  .publicacion-info .eyebrow{font-size:10px; margin-bottom:4px; display:block;}

  /* Columna "Sector publicitario" */
  .ads-col{
    background:var(--white); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; position:sticky; top:88px;
  }
  .ads-col .eyebrow{display:block; margin-bottom:14px;}
  .ad-card{margin-bottom:18px;}
  .ad-card:last-child{margin-bottom:0;}
  .ad-card .ad-empresa{font-size:12.5px; font-weight:600; color:var(--green-deep-2); margin-bottom:6px; display:block;}
  .ad-card .ad-img{
    width:100%; aspect-ratio:1/1; border-radius:var(--radius); background:var(--paper);
    border:1px solid var(--line); object-fit:cover; display:block;
  }
  .ad-card .ad-desc{font-size:12px; margin-top:6px; color:var(--ink-soft);}
  .ads-empty{font-size:12.5px; color:var(--ink-soft); text-align:center; padding:20px 0;}
  .ad-card .ad-icon{
    width:100%; aspect-ratio:1/1; border-radius:var(--radius); background:var(--green-deep);
    color:var(--white); display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:28px;
  }
  .ad-card .ad-meta{font-size:11.5px; color:var(--green-sage); font-family:'Space Mono',monospace; margin-top:2px;}

  /* Botón Publicar destacado */
  .publicar-btn{color:var(--green-deep);}
  .publicar-btn:hover{background:var(--paper);}

  /* ===== MODAL PUBLICAR ===== */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(20,32,22,0.45); z-index:100;
    align-items:flex-start; justify-content:center; padding:60px 16px; overflow-y:auto;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:var(--white); border-radius:6px; max-width:480px; width:100%;
    padding:26px; box-shadow:var(--shadow);
  }
  .modal-box h3{font-size:18px; margin-bottom:4px;}
  .modal-box .modal-sub{font-size:13px; color:var(--ink-soft); margin-bottom:20px;}
  .campo{margin-bottom:14px;}
  .campo label{
    display:block; font-family:'Space Mono',monospace; font-size:11px; text-transform:uppercase;
    letter-spacing:0.06em; color:var(--green-sage); margin-bottom:5px;
  }
  .campo input, .campo select, .campo textarea{
    width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:var(--radius);
    font-family:'Work Sans',sans-serif; font-size:14px; color:var(--ink); background:var(--paper);
    outline:none;
  }
  .campo textarea{resize:vertical; min-height:70px;}
  .campo-fila{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .tipo-toggle{display:flex; gap:8px; margin-bottom:16px;}
  .tipo-toggle button{
    flex:1; padding:9px; border:1px solid var(--line); background:var(--paper); border-radius:var(--radius);
    font-family:'Work Sans',sans-serif; font-size:13.5px; cursor:pointer; color:var(--ink-soft);
  }
  .tipo-toggle button.active{background:var(--green-deep); color:var(--white); border-color:var(--green-deep);}
  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  .btn-cancelar, .btn-publicar{
    flex:1; padding:11px; border-radius:var(--radius); border:none; cursor:pointer;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px;
  }
  .btn-cancelar{background:var(--paper); color:var(--ink-soft); border:1px solid var(--line);}
  .btn-publicar{background:var(--green-deep); color:var(--white);}
  .btn-publicar:disabled{opacity:0.6; cursor:default;}
  .modal-msg{font-size:12.5px; margin-top:10px; text-align:center;}
  .modal-msg.error{color:#B3413E;}
  .modal-msg.ok{color:var(--green-sage);}

  /* Subida de imágenes en el modal Publicar */
  .campo-imagenes label{
    display:block; font-family:'Space Mono',monospace; font-size:11px; text-transform:uppercase;
    letter-spacing:0.06em; color:var(--green-sage); margin-bottom:5px;
  }
  .dropzone-imagenes{
    border:1.5px dashed var(--line); border-radius:var(--radius); padding:16px;
    text-align:center; cursor:pointer; background:var(--paper); font-size:13px; color:var(--ink-soft);
  }
  .dropzone-imagenes:hover{border-color:var(--green-sage);}
  .preview-imagenes{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .preview-item{position:relative; width:64px; height:64px; border-radius:var(--radius); overflow:hidden; border:1px solid var(--line);}
  .preview-item img{width:100%; height:100%; object-fit:cover; display:block;}
  .preview-item button{
    position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%;
    background:rgba(20,32,22,0.75); color:var(--white); border:none; cursor:pointer;
    font-size:12px; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .subiendo-imagenes{font-size:12px; color:var(--ink-soft); margin-top:6px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="panel-nav">
  <div class="panel-nav-inner">
    <!-- PERFIL -->
    <button class="perfil-btn" onclick="window.location.href='mi-perfil.html'" title="Ir a mi perfil">
      <span class="perfil-avatar" id="avatarIniciales">--</span>
      <span class="perfil-info">
        <span class="eyebrow">Perfil</span>
        <span class="nombre" id="nombreUsuario">Cargando...</span>
      </span>
    </button>

    <!-- BUSCADOR -->
    <div class="buscador">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="inputBuscador" type="text" placeholder="Buscar productores, empresas o servicios..." onkeydown="if(event.key==='Enter')buscar()">
    </div>

    <!-- ICONOS -->
    <div class="nav-icons">
      <button class="icon-btn publicar-btn" title="Publicar" onclick="abrirModalPublicar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        <span>Publicar</span>
      </button>
      <button class="icon-btn" title="Menú" onclick="alert('Menú: próximamente vamos a sumar acá el resto de las secciones.')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Menú</span>
      </button>
      <button class="icon-btn" title="Mensajes" onclick="window.location.href='mensajes.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="icon-badge" id="badgeMensajes"></span>
        <span>Mensajes</span>
      </button>
      <button class="icon-btn" title="Notificaciones" onclick="alert('Notificaciones: próximamente.')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="icon-badge" id="badgeNotif"></span>
        <span>Avisos</span>
      </button>
      <button class="icon-btn" title="Cerrar sesión" onclick="cerrarSesion()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span>Salir</span>
      </button>
    </div>
  </div>

  <!-- PESTAÑAS -->
  <nav class="tabs-bar">
    <button class="tab-item active" data-tab="productores" onclick="cambiarTab('productores')">Productores</button>
    <button class="tab-item" data-tab="empresas" onclick="cambiarTab('empresas')">Empresas</button>
    <button class="tab-item" data-tab="servicios" onclick="cambiarTab('servicios')">Servicios</button>
  </nav>
</header>

<div class="panel-body">
  <!-- FEED DE PUBLICACIONES -->
  <section class="feed" id="feedContainer">
    <div class="feed-loading">Cargando publicaciones...</div>
  </section>

  <!-- SECTOR PUBLICITARIO -->
  <aside class="ads-col">
    <span class="eyebrow">Sector publicitario</span>
    <div id="adsContainer">
      <div class="ads-empty">Cargando...</div>
    </div>
  </aside>
</div>

<!-- MODAL: Publicar -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3 id="modalTitulo">Publicar</h3>
    <p class="modal-sub" id="modalSub">Cargando tu perfil...</p>
    <div id="modalFormContainer"></div>
    <div class="modal-actions">
      <button class="btn-cancelar" onclick="cerrarModalPublicar()">Cancelar</button>
      <button class="btn-publicar" id="btnPublicarSubmit" onclick="enviarPublicacion()">Publicar</button>
    </div>
    <div class="modal-msg" id="modalMsg"></div>
  </div>
</div>

<script>
  // ======================================================
  // CONFIGURACIÓN DE SUPABASE (mismo proyecto que panel.html)
  // ======================================================
  const SUPABASE_URL = 'https://yolccrvajsaltnfzvglr.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_lt6djx886Pwd8aqreZ7TSg_97WUM0Wf';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let tabActual = 'productores';
  let usuarioActual = null;
  let misRoles = []; // todos los roles detectados: ['productor','proveedor_servicio',...]
  let rolActivo = null; // el rol que está seleccionado ahora mismo para publicar
  let cultivosCache = null;
  let tipoNecesidadModal = 'producto'; // toggle dentro del modal para compradores

  // ------------------------------------------------------
  // 0) Probamos el nombre de cada tabla en minúscula y con la
  //    inicial en mayúscula, y nos quedamos con el que exista
  //    de verdad. Usamos un select con límite 1 (no "head") para
  //    que el error de "tabla no encontrada" se detecte bien —
  //    la vez pasada usábamos head+count y ese tipo de consulta
  //    no devolvía el error correctamente, por eso fallaba.
  // ------------------------------------------------------
  const cacheNombresTabla = {};
  async function resolverTabla(candidatos){
    const key = candidatos.join('|');
    if (cacheNombresTabla[key]) return cacheNombresTabla[key];
    for (const nombre of candidatos){
      const { error } = await supabaseClient.from(nombre).select('*').limit(1);
      if (!error){ cacheNombresTabla[key] = nombre; return nombre; }
    }
    cacheNombresTabla[key] = candidatos[0];
    return candidatos[0];
  }

  function variantesNombre(nombre){
    const capitalizado = nombre.charAt(0).toUpperCase() + nombre.slice(1);
    return [nombre, capitalizado];
  }

  let TABLA_USUARIOS, TABLA_PUBLICACIONES, TABLA_PRODUCTORES, TABLA_COMPRADORES,
      TABLA_PROVEEDORES_SERVICIOS, TABLA_SERVICIOS_OFRECIDOS, TABLA_SOLICITUDES_COMPRADORES, TABLA_CULTIVOS,
      TABLA_PUBLICACION_IMAGENES, TABLA_SERVICIO_IMAGENES, TABLA_SOLICITUD_IMAGENES;

  const NOMBRE_BUCKET_IMAGENES = 'publicaciones-imagenes';

  // ------------------------------------------------------
  // 1) Chequear que haya sesión activa. Si no hay, de vuelta
  //    al panel de login (esta pantalla es solo para logueados).
  // ------------------------------------------------------
  (async function init(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session?.user){
      window.location.href = 'panel.html';
      return;
    }
    usuarioActual = session.user;

    [
      TABLA_USUARIOS, TABLA_PUBLICACIONES, TABLA_PRODUCTORES, TABLA_COMPRADORES,
      TABLA_PROVEEDORES_SERVICIOS, TABLA_SERVICIOS_OFRECIDOS, TABLA_SOLICITUDES_COMPRADORES, TABLA_CULTIVOS,
      TABLA_PUBLICACION_IMAGENES, TABLA_SERVICIO_IMAGENES, TABLA_SOLICITUD_IMAGENES
    ] = await Promise.all([
      resolverTabla(variantesNombre('usuarios')),
      resolverTabla(variantesNombre('publicaciones')),
      resolverTabla(variantesNombre('productores')),
      resolverTabla(variantesNombre('compradores')),
      resolverTabla(variantesNombre('proveedores_servicios')),
      resolverTabla(variantesNombre('servicios_ofrecidos')),
      resolverTabla(variantesNombre('solicitudes_compradores')),
      resolverTabla(variantesNombre('cultivos')),
      resolverTabla(variantesNombre('publicacion_imagenes')),
      resolverTabla(variantesNombre('servicio_imagenes')),
      resolverTabla(variantesNombre('solicitud_imagenes'))
    ]);

    await cargarPerfil();
    await detectarRol();
    await cargarFeed();
    await cargarPublicidad();
  })();

  // ------------------------------------------------------
  // 1.b) Detectar qué tipo de perfil tiene el usuario logueado
  //    (productor / comprador / proveedor de servicios), buscando
  //    en qué tabla existe una fila con su usuario_id.
  //    Esto solo nos sirve para PRESELECCIONAR el rol con el que
  //    ya venías publicando — el selector siempre te va a dejar
  //    elegir cualquiera de los 3, tengas o no la ficha creada.
  // ------------------------------------------------------
  const TODOS_LOS_ROLES = ['productor', 'comprador', 'proveedor_servicio'];

  async function detectarRol(){
    const [prod, comp, prov] = await Promise.all([
      supabaseClient.from(TABLA_PRODUCTORES).select('usuario_id').eq('usuario_id', usuarioActual.id).maybeSingle(),
      supabaseClient.from(TABLA_COMPRADORES).select('usuario_id').eq('usuario_id', usuarioActual.id).maybeSingle(),
      supabaseClient.from(TABLA_PROVEEDORES_SERVICIOS).select('usuario_id').eq('usuario_id', usuarioActual.id).maybeSingle()
    ]);
    misRoles = [];
    if (prod.data) misRoles.push('productor');
    if (comp.data) misRoles.push('comprador');
    if (prov.data) misRoles.push('proveedor_servicio');
    rolActivo = misRoles[0] || 'productor';
  }

  // Si el usuario elige publicar con un rol que todavía no tiene
  // ficha creada (ej: nunca se registró como empresa), le creamos
  // esa ficha básica en el momento, antes de guardar la publicación.
  async function asegurarPerfilDeRol(rol){
    if (misRoles.includes(rol)) return; // ya la tiene
    const tabla = rol === 'productor' ? TABLA_PRODUCTORES
                : rol === 'comprador' ? TABLA_COMPRADORES
                : TABLA_PROVEEDORES_SERVICIOS;
    const { error } = await supabaseClient.from(tabla).insert({ usuario_id: usuarioActual.id });
    // Si ya existía (carrera entre pestañas, doble clic, etc.) no es un error real.
    if (error && error.code !== '23505') throw error;
    misRoles.push(rol);
  }

  // ------------------------------------------------------
  // 2) Traer nombre del usuario logueado desde la tabla "usuarios"
  //    para mostrarlo arriba a la izquierda (como en el boceto).
  // ------------------------------------------------------
  async function cargarPerfil(){
    const { data, error } = await supabaseClient
      .from(TABLA_USUARIOS)
      .select('nombre')
      .eq('id', usuarioActual.id)
      .maybeSingle();

    const nombre = (!error && data?.nombre) ? data.nombre : (usuarioActual.email || 'Mi perfil');
    document.getElementById('nombreUsuario').textContent = nombre;
    document.getElementById('avatarIniciales').textContent = nombre.trim().charAt(0).toUpperCase();
  }

  // ------------------------------------------------------
  // 3) Cargar el feed según la pestaña activa. Cada pestaña sale
  //    de una tabla distinta, porque cada tipo de perfil publica
  //    algo distinto:
  //    - Productores  -> tabla "Publicaciones" (vende cultivos)
  //    - Servicios    -> tabla "servicios_ofrecidos"
  //    - Empresas     -> tabla "solicitudes_compradores"
  // ------------------------------------------------------
  async function cargarFeed(){
    const feedEl = document.getElementById('feedContainer');
    feedEl.innerHTML = '<div class="feed-loading">Cargando publicaciones...</div>';

    if (tabActual === 'productores') return cargarFeedProductores(feedEl);
    if (tabActual === 'servicios') return cargarFeedServicios(feedEl);
    if (tabActual === 'empresas') return cargarFeedEmpresas(feedEl);
  }

  function mostrarFeedVacio(feedEl, mensaje){
    feedEl.innerHTML = `
      <div class="feed-empty">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
        <h3>Todavía no hay publicaciones acá</h3>
        <p>${mensaje}</p>
      </div>`;
  }

  function formatearPrecio(precio, moneda){
    if (precio === null || precio === undefined) return '';
    return `${moneda || 'ARS'} ${Number(precio).toLocaleString('es-AR')}`;
  }

  async function cargarFeedProductores(feedEl){
    const { data, error } = await supabaseClient
      .from(TABLA_PUBLICACIONES)
      .select('id, cantidad, unidad, precio, moneda, descripcion, estado, creado_en, cultivos(nombre), publicacion_imagenes(url)')
      .eq('estado', 'activa')
      .order('creado_en', { ascending: false })
      .limit(20);

    if (error || !data || data.length === 0){
      mostrarFeedVacio(feedEl, 'Cuando los productores publiquen su cosecha (cultivo, cantidad y precio), va a aparecer acá.');
      return;
    }

    feedEl.innerHTML = data.map(pub => `
      <div class="publicacion-card">
        <img class="publicacion-img" src="${pub.publicacion_imagenes?.[0]?.url || ''}" alt="${pub.cultivos?.nombre || ''}" onerror="this.style.display='none'">
        <div class="publicacion-info">
          <span class="eyebrow">${pub.cultivos?.nombre || 'Cultivo'} · ${pub.cantidad ?? ''} ${pub.unidad || ''}</span>
          <h4>${formatearPrecio(pub.precio, pub.moneda) || 'Precio a consultar'}</h4>
          <p>${pub.descripcion || ''}</p>
        </div>
      </div>
    `).join('');
  }

  async function cargarFeedServicios(feedEl){
    const { data, error } = await supabaseClient
      .from(TABLA_SERVICIOS_OFRECIDOS)
      .select('id, tipo_servicio, descripcion, precio, unidad_precio, disponible, creado_en, proveedores_servicios(nombre_empresa, zona_cobertura), servicio_imagenes(url)')
      .eq('disponible', true)
      .order('creado_en', { ascending: false })
      .limit(20);

    if (error || !data || data.length === 0){
      mostrarFeedVacio(feedEl, 'Cuando los prestadores publiquen sus servicios, van a aparecer acá.');
      return;
    }

    feedEl.innerHTML = data.map(s => `
      <div class="publicacion-card">
        ${s.servicio_imagenes?.[0]?.url ? `<img class="publicacion-img" src="${s.servicio_imagenes[0].url}" alt="" onerror="this.style.display='none'">` : ''}
        <div class="publicacion-info" style="flex:1">
          <span class="eyebrow">${s.proveedores_servicios?.nombre_empresa || 'Prestador de servicios'}${s.proveedores_servicios?.zona_cobertura ? ' · ' + s.proveedores_servicios.zona_cobertura : ''}</span>
          <h4>${s.tipo_servicio || 'Servicio'}</h4>
          <p>${s.descripcion || ''}</p>
          ${s.precio ? `<p style="margin-top:4px;font-weight:600;color:var(--green-deep-2)">${formatearPrecio(s.precio, null)}${s.unidad_precio ? ' / ' + s.unidad_precio : ''}</p>` : ''}
        </div>
      </div>
    `).join('');
  }

  async function cargarFeedEmpresas(feedEl){
    const { data, error } = await supabaseClient
      .from(TABLA_SOLICITUDES_COMPRADORES)
      .select('id, tipo_necesidad, tipo_servicio, cantidad, unidad, descripcion, precio_ofrecido, moneda, estado, creado_en, cultivos(nombre), compradores(nombre_empresa), solicitud_imagenes(url)')
      .eq('estado', 'activa')
      .order('creado_en', { ascending: false })
      .limit(20);

    if (error || !data || data.length === 0){
      mostrarFeedVacio(feedEl, 'Cuando las empresas publiquen qué necesitan comprar o contratar, va a aparecer acá.');
      return;
    }

    feedEl.innerHTML = data.map(s => {
      const queNecesita = s.tipo_necesidad === 'producto'
        ? `${s.cultivos?.nombre || 'Producto'} · ${s.cantidad ?? ''} ${s.unidad || ''}`
        : (s.tipo_servicio || 'Servicio');
      return `
      <div class="publicacion-card">
        ${s.solicitud_imagenes?.[0]?.url ? `<img class="publicacion-img" src="${s.solicitud_imagenes[0].url}" alt="" onerror="this.style.display='none'">` : ''}
        <div class="publicacion-info" style="flex:1">
          <span class="eyebrow">${s.compradores?.nombre_empresa || 'Empresa'} · busca ${s.tipo_necesidad === 'producto' ? 'comprar' : 'contratar'}</span>
          <h4>${queNecesita}</h4>
          <p>${s.descripcion || ''}</p>
          ${s.precio_ofrecido ? `<p style="margin-top:4px;font-weight:600;color:var(--green-deep-2)">Ofrece: ${formatearPrecio(s.precio_ofrecido, s.moneda)}</p>` : ''}
        </div>
      </div>`;
    }).join('');
  }

  // ------------------------------------------------------
  // 4) Columna "Sector publicitario": por ahora trae hasta 4
  //    prestadores de servicios como espacio destacado. Es un
  //    primer armado simple — si querés que sea un espacio pago
  //    de verdad (con su propia tabla), lo armamos aparte.

  async function cargarPublicidad(){

  // ------------------------------------------------------
  // Subida de imágenes: el usuario elige hasta 5 fotos, se
  // muestran como miniaturas, y recién se suben al Storage
  // cuando confirma "Publicar" (junto con el resto de los datos).
  // ------------------------------------------------------
  let archivosImagenesSeleccionados = [];
  const MAX_IMAGENES = 5;

  function manejarSeleccionImagenes(event){
    const nuevos = Array.from(event.target.files || []);
    archivosImagenesSeleccionados = [...archivosImagenesSeleccionados, ...nuevos].slice(0, MAX_IMAGENES);
    event.target.value = ''; // permite volver a elegir el mismo archivo si lo saca y lo quiere subir de nuevo
    renderPreviewImagenes();
  }

  function quitarImagenSeleccionada(indice){
    archivosImagenesSeleccionados.splice(indice, 1);
    renderPreviewImagenes();
  }

  function renderPreviewImagenes(){
    const cont = document.getElementById('previewImagenes');
    if (!cont) return;
    cont.innerHTML = archivosImagenesSeleccionados.map((file, i) => `
      <div class="preview-item">
        <img src="${URL.createObjectURL(file)}" alt="">
        <button type="button" onclick="quitarImagenSeleccionada(${i})">✕</button>
      </div>
    `).join('');
  }

  // Sube todos los archivos elegidos al bucket de Storage y guarda
  // sus URLs en la tabla de imágenes correspondiente (una por tipo
  // de publicación). Se llama recién después de crear la publicación,
  // ya que necesitamos su id para relacionar las fotos con ella.
  async function subirImagenesDeLaPublicacion(idPublicacion){
    if (archivosImagenesSeleccionados.length === 0) return;

    const tablaImagenes = rolActivo === 'productor' ? TABLA_PUBLICACION_IMAGENES
                         : rolActivo === 'proveedor_servicio' ? TABLA_SERVICIO_IMAGENES
                         : TABLA_SOLICITUD_IMAGENES;
    const columnaId = rolActivo === 'productor' ? 'publicacion_id'
                     : rolActivo === 'proveedor_servicio' ? 'servicio_id'
                     : 'solicitud_id';
    // La tabla original "publicacion_imagenes" guarda el link en la
    // columna "URL" (mayúscula); las tablas nuevas usan "url" en minúscula.
    const columnaUrl = 'url'; // las 3 tablas de imágenes usan la columna "url" en minúscula

    for (let i = 0; i < archivosImagenesSeleccionados.length; i++){
      const file = archivosImagenesSeleccionados[i];
      const rutaArchivo = `${usuarioActual.id}/${idPublicacion}/${Date.now()}_${i}_${file.name}`;

      const { error: errorSubida } = await supabaseClient.storage
        .from(NOMBRE_BUCKET_IMAGENES)
        .upload(rutaArchivo, file);

      if (errorSubida) continue; // si una foto falla, seguimos con las demás

      const { data: urlPublica } = supabaseClient.storage
        .from(NOMBRE_BUCKET_IMAGENES)
        .getPublicUrl(rutaArchivo);

      await supabaseClient.from(tablaImagenes).insert({
        [columnaId]: idPublicacion,
        [columnaUrl]: urlPublica.publicUrl,
        orden: i
      });
    }
  }

  // Busca el cultivo por nombre (sin importar mayúsculas) y si no
  // existe todavía en el catálogo, lo crea. Así el campo "Cultivo"
  // puede ser texto libre en vez de una lista cerrada.
  async function obtenerOCrearCultivoId(nombreEscrito){
    const nombre = nombreEscrito.trim();
    if (!nombre) throw new Error('Ingresá el cultivo.');

    const existente = cultivosCache.find(c => c.nombre.toLowerCase() === nombre.toLowerCase());
    if (existente) return existente.id;

    const { data, error } = await supabaseClient
      .from(TABLA_CULTIVOS)
      .insert({ nombre })
      .select('id, nombre')
      .single();

    if (error) throw new Error('No pudimos guardar el cultivo "' + nombre + '".');
    cultivosCache.push(data);
    return data.id;
  }

  async function enviarPublicacion(){
    const msgEl = document.getElementById('modalMsg');
    const btn = document.getElementById('btnPublicarSubmit');
    msgEl.textContent = ''; msgEl.className = 'modal-msg';
    btn.disabled = true; btn.textContent = 'Publicando...';

    try{
      let error;

      // Si es la primera vez que publicás con este rol, le creamos
      // la ficha básica antes de guardar la publicación.
      await asegurarPerfilDeRol(rolActivo);

      if (rolActivo === 'productor'){
        const cantidad = parseFloat(document.getElementById('f_cantidad').value);
        if (!cantidad){ throw new Error('Ingresá una cantidad válida.'); }
        const cultivoId = await obtenerOCrearCultivoId(document.getElementById('f_cultivo').value);
        const resultado = await supabaseClient.from(TABLA_PUBLICACIONES).insert({
          productor_id: usuarioActual.id,
          cultivo_id: cultivoId,
          cantidad,
          unidad: document.getElementById('f_unidad').value,
          precio: parseFloat(document.getElementById('f_precio').value) || null,
          moneda: document.getElementById('f_moneda').value,
          descripcion: document.getElementById('f_descripcion').value || null,
          estado: 'activa'
        }).select('id').single();
        error = resultado.error;
        if (!error) await subirImagenesDeLaPublicacion(resultado.data.id);
      }

      if (rolActivo === 'proveedor_servicio'){
        const tipoServicio = document.getElementById('f_tipo_servicio').value.trim();
        if (!tipoServicio){ throw new Error('Contanos qué tipo de servicio ofrecés.'); }
        const resultado = await supabaseClient.from(TABLA_SERVICIOS_OFRECIDOS).insert({
          proveedor_id: usuarioActual.id,
          tipo_servicio: tipoServicio,
          descripcion: document.getElementById('f_descripcion').value || null,
          precio: parseFloat(document.getElementById('f_precio').value) || null,
          unidad_precio: document.getElementById('f_unidad_precio').value || null,
          disponible: true
        }).select('id').single();
        error = resultado.error;
        if (!error) await subirImagenesDeLaPublicacion(resultado.data.id);
      }

      if (rolActivo === 'comprador'){
        const payload = {
          comprador_id: usuarioActual.id,
          tipo_necesidad: tipoNecesidadModal,
          descripcion: document.getElementById('f_descripcion').value || null,
          precio_ofrecido: parseFloat(document.getElementById('f_precio_ofrecido').value) || null,
          moneda: document.getElementById('f_moneda').value,
          estado: 'activa'
        };
        if (tipoNecesidadModal === 'producto'){
          const cantidad = parseFloat(document.getElementById('f_cantidad').value);
          if (!cantidad){ throw new Error('Ingresá una cantidad válida.'); }
          payload.cultivo_id = await obtenerOCrearCultivoId(document.getElementById('f_cultivo').value);
          payload.cantidad = cantidad;
          payload.unidad = document.getElementById('f_unidad').value;
        } else {
          const tipoServicio = document.getElementById('f_tipo_servicio').value.trim();
          if (!tipoServicio){ throw new Error('Contanos qué servicio buscás contratar.'); }
          payload.tipo_servicio = tipoServicio;
        }
        const resultado = await supabaseClient.from(TABLA_SOLICITUDES_COMPRADORES).insert(payload).select('id').single();
        error = resultado.error;
        if (!error) await subirImagenesDeLaPublicacion(resultado.data.id);
      }

      if (error) throw error;

      msgEl.textContent = '¡Publicado con éxito!';
      msgEl.className = 'modal-msg ok';

      const mapaTab = { productor: 'productores', proveedor_servicio: 'servicios', comprador: 'empresas' };
      cambiarTab(mapaTab[rolActivo]);

      setTimeout(cerrarModalPublicar, 900);

    } catch(err){
      msgEl.textContent = err.message || 'Hubo un error al publicar. Probá de nuevo.';
      msgEl.className = 'modal-msg error';
    } finally {
      btn.disabled = false; btn.textContent = 'Publicar';
    }
  }
</script>

</body>
</html>
