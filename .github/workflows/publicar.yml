name: Publicar sitio y paginas de anuncios

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.reintento.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Recuperar ultimos caudales buenos
        uses: actions/cache/restore@v4
        with:
          path: caudales.json
          key: caudales-sin-coincidencia-exacta
          restore-keys: |
            caudales-

      - name: Instalar lector de PDF
        continue-on-error: true
        run: command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      - name: Actualizar caudales de los rios
        id: caudales
        continue-on-error: true
        run: python3 caudales.py

      - name: Guardar copia de los caudales
        if: steps.caudales.outputs.boletin != ''
        uses: actions/cache/save@v4
        with:
          path: caudales.json
          key: caudales-${{ steps.caudales.outputs.boletin }}

      - name: Generar paginas de anuncios
        id: gen
        continue-on-error: true
        run: node generar-paginas.mjs

      - name: Armar el sitio
        id: armar
        if: steps.gen.outcome == 'success' || github.event_name != 'schedule'
        run: |
          mkdir _site
          tar --exclude='./.git' --exclude='./.github' --exclude='./_site' --exclude='./generar-paginas.mjs' --exclude='./caudales.py' -cf - . | tar -xf - -C _site

      - uses: actions/configure-pages@v6
        if: steps.armar.outcome == 'success'

      - uses: actions/upload-pages-artifact@v5
        if: steps.armar.outcome == 'success'
        with:
          path: _site

      - id: deployment
        if: steps.armar.outcome == 'success'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Esperar antes de reintentar la publicacion
        if: steps.armar.outcome == 'success' && steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: reintento
        if: steps.armar.outcome == 'success' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
